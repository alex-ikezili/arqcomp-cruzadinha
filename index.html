<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruzadinha - Arquitetura Computacional</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Cruzadinha de Arquitetura Computacional</h1>
        <p>Descubra as palavras através das pistas!</p>
    </header>

    <main>

        <section>
            <h2>Tabuleiro</h2>
            <div id="tabuleiro"></div>
        </section>

        <section id="controles">
            <button id="btn-conferir">Conferir</button>
            <p id="resultado">Acertos: 0 de 12</p>
        </section>

        <section>
            <h2>Pistas</h2>

            <div class="pistas-container">

                <div>
                    <h3>Horizontais</h3>
                    <ol id="horizontais"></ol>
                </div>

                <div>
                    <h3>Verticais</h3>
                    <ol id="verticais"></ol>
                </div>

            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
